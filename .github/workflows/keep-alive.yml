# Keeps the Supabase free project from being paused.
#
# Supabase pauses a free project after ~7 days of inactivity. A paused project
# is unreachable until somebody restores it by hand from the dashboard, so for
# an app used every couple of weeks that is a guaranteed outage. This workflow
# pokes /api/keep-alive every two days, which is well inside the window.
#
# GitHub Actions rather than Vercel Cron: Hobby cron is limited in both
# frequency and count, and Actions is free and more flexible.
#
# Three jobs share this one workflow — the heartbeat, the outbox sweep and
# retention — because a second workflow is a second thing GitHub disables after
# sixty quiet days, and two of these failing silently have consequences that
# take weeks to notice.
#
# ⚠️ THE FAILURE MODE BEHIND THE FAILURE MODE
# GitHub disables scheduled workflows automatically after ~60 days of
# repository inactivity, and emails the repo owner when it does. If this app is
# running happily and nobody commits for two months, this workflow stops, and
# ~7 days later the database pauses. To resume: push any commit, or re-enable
# the workflow from the Actions tab. See README.md → "Keeping it alive".

name: Keep database awake

on:
  schedule:
    # Every six hours, at an odd minute — the odd minute avoids the top-of-hour
    # rush when GitHub's scheduler is most contended and most likely to delay
    # or drop a run.
    #
    # It used to be every second day, which is all the database pause needs.
    # The outbox sweep is what raised it: a failed invitation retried two days
    # later is not a retry, it is an apology. Four runs a day is still nothing
    # against the Actions allowance, and more frequent pings make the pause
    # protection strictly better.
    - cron: "17 */6 * * *"
  # Lets you verify the setup without waiting two days.
  workflow_dispatch:

# No repository access needed — this only makes an outbound HTTP request.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the keep-alive endpoint
        env:
          # Repository variable (Settings → Secrets and variables → Actions →
          # Variables), e.g. https://your-app.vercel.app
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL repository variable is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          # A cold Vercel function plus a waking database can be slow, so retry
          # a few times before calling it a failure.
          for attempt in 1 2 3; do
            echo "Attempt $attempt…"
            code=$(curl --silent --show-error --location \
                        --max-time 30 \
                        --output response.json \
                        --write-out '%{http_code}' \
                        "${APP_URL%/}/api/keep-alive" || echo "000")

            if [ "$code" = "200" ]; then
              echo "OK:"
              cat response.json
              exit 0
            fi

            echo "Got HTTP $code"
            [ -s response.json ] && cat response.json
            sleep 15
          done

          echo "::error::keep-alive did not return 200 after 3 attempts."
          exit 1

      # The outbox sweep: anything written down and not sent. Almost always
      # nothing — every message is dispatched the moment it is enqueued — so
      # this is here for what failed, what is waiting out a backoff, and what
      # was enqueued by a process that died before sending it.
      #
      # `continue-on-error` for the same reason as retention below: keeping the
      # database awake is the job this workflow is named for.
      - name: Dispatch the outbox
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL }}
          RETENTION_SECRET: ${{ secrets.RETENTION_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${RETENTION_SECRET:-}" ]; then
            echo "::warning::RETENTION_SECRET is not set — skipping the outbox."
            exit 0
          fi

          code=$(curl --silent --show-error --location \
                      --max-time 60 \
                      --request POST \
                      --header "Authorization: Bearer ${RETENTION_SECRET}" \
                      --output outbox.json \
                      --write-out '%{http_code}' \
                      "${APP_URL%/}/api/outbox" || echo "000")

          if [ "$code" = "200" ]; then
            echo "Dispatched:"
            cat outbox.json
            exit 0
          fi

          echo "::warning::outbox returned HTTP $code"
          [ -s outbox.json ] && cat outbox.json

      # Retention runs on the same schedule and in the same workflow, because a
      # second workflow is a second thing GitHub can disable after 60 days of
      # repository inactivity — and the failure mode of a silently stopped
      # retention job is data outliving what the privacy notice promises.
      #
      # `continue-on-error`: keeping the database awake is the job this workflow
      # is named for, and a retention failure must not make it look like that
      # one failed. It still shows up as an annotation.
      - name: Run scheduled retention
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL }}
          RETENTION_SECRET: ${{ secrets.RETENTION_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${RETENTION_SECRET:-}" ]; then
            echo "::warning::RETENTION_SECRET is not set — skipping retention."
            exit 0
          fi

          code=$(curl --silent --show-error --location \
                      --max-time 60 \
                      --request POST \
                      --header "Authorization: Bearer ${RETENTION_SECRET}" \
                      --output retention.json \
                      --write-out '%{http_code}' \
                      "${APP_URL%/}/api/retention" || echo "000")

          if [ "$code" = "200" ]; then
            echo "Deleted:"
            cat retention.json
            exit 0
          fi

          echo "::warning::retention returned HTTP $code"
          [ -s retention.json ] && cat retention.json
