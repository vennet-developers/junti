# The gate that was missing.
#
# Every check in here already existed as a script and was only ever run by
# somebody remembering to run it. `Add regression tests for contribution and
# split math` had four of its five criteria met months ago; the fifth — "tests
# run in CI and block merge on failure" — is this file. Until now nothing
# stopped a push that failed typecheck, lint, tests or the client-bundle
# tripwire.
#
# ⚠️ THIS DOES NOT GATE THE DEPLOY.
# Vercel builds from its own GitHub integration and does not wait for Actions.
# A push that fails here still deploys if Vercel's own build succeeds — and
# Vercel runs `vite build`, so it catches the build but not the tests. Treat a
# red run here as "revert or fix", not as "it was blocked". Making the deploy
# wait means moving it behind this workflow, which is a bigger change than the
# card asked for.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push while the first is still running makes the first result
# irrelevant. Cancel it rather than pay for both and read the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only reads. `packages: read` is what lets the built-in token fetch from
# GitHub Packages — see the install step for why that alone is not enough here.
permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No version pinned on purpose: `packageManager` in package.json is the
      # single source of truth, and pnpm/action-setup reads it. Two places
      # naming a version is two places to forget.
      - uses: pnpm/action-setup@v4

      # `registry-url` + `scope` is what makes this job able to install at all.
      # It writes an npmrc the installer trusts, carrying
      # `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}` — an env
      # reference, which pnpm expands in a USER-level npmrc and deliberately
      # refuses to expand in the committed project one. The project `.npmrc`
      # maps the scope and says exactly this.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@stackmyth'

      # ── Why a PAT and not the built-in token ──────────────────────────────
      #
      # `secrets.GITHUB_TOKEN` can only read packages owned by THIS repository's
      # owner. Junti lives in `vennet-developers`; the `@stackmyth/*` packages
      # are published from `stackmyth/stackmyth`, a different org. So the built-in
      # token authenticates fine and is then told it has no access — which
      # surfaces as the 401 that broke this workflow:
      #
      #   [ERR_PNPM_FETCH_401] GET .../@stackmyth%2Fbadge: Unauthorized
      #
      # `STACKMYTH_NPM_TOKEN` is a classic PAT with `read:packages`, set as a
      # repository secret. Verified against the live registry before writing
      # this: a PAT of that shape returns 200 for `@stackmyth/badge` across the
      # org boundary.
      #
      # No fallback to GITHUB_TOKEN, deliberately. One would read as a second
      # way for this to work and there is no second way today — it would only
      # turn a clear failure back into the 401. If the two orgs ever end up
      # under one owner, delete this step and swap the secret below.
      - name: Check the registry credential exists
        env:
          TOKEN: ${{ secrets.STACKMYTH_NPM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::STACKMYTH_NPM_TOKEN is not set. The @stackmyth packages live in another org, so the built-in GITHUB_TOKEN cannot read them and pnpm install will fail with a 401. Create a classic PAT with read:packages and add it as a repository secret."
            exit 1
          fi

      # `--frozen-lockfile` is the default in CI, stated anyway: an install
      # that quietly updates the lockfile is testing something other than what
      # the commit says.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STACKMYTH_NPM_TOKEN }}

      # ── Build FIRST, and do not reorder this ──────────────────────────────
      #
      # `src/routeTree.gen.ts` is generated and gitignored, so a fresh checkout
      # does not have it. The Vite plugin writes it during the build. Running
      # typecheck before this produces ~50 import errors that look like real
      # breakage and are not.
      #
      # The build also runs `scripts/check-client-bundle.mjs`, the tripwire
      # that fails if server-only code fingerprints land in a browser bundle.
      # That check has caught two real leaks and only exists at build time.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # No environment variables anywhere in this job, and that is a property
      # worth keeping: the build was verified to complete with none set. If a
      # step ever starts needing a database, it is doing something at build
      # time that belongs at request time.
